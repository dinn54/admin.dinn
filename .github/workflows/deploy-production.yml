name: Deploy Production

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Discord success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          commit_message="$(git log -1 --pretty=%s)"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          payload="$(jq -n \
            --arg title "프로덕션 배포 성공" \
            --arg description "admin.dinn production 배포가 완료됐습니다." \
            --arg deployment "$DEPLOY_URL" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$short_sha - $commit_message" \
            --arg commit_url "$commit_url" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$run_url" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  color: 2260342,
                  fields: [
                    {name: "배포", value: ("[배포 URL 열기](" + $deployment + ")"), inline: false},
                    {name: "브랜치", value: $branch, inline: true},
                    {name: "실행자", value: $actor, inline: true},
                    {name: "커밋", value: ("[" + $commit + "](" + $commit_url + ")"), inline: false},
                    {name: "Actions", value: ("[실행 로그 열기](" + $run_url + ")"), inline: false}
                  ]
                }
              ]
            }' \
          )"
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          commit_message="$(git log -1 --pretty=%s)"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          payload="$(jq -n \
            --arg title "프로덕션 배포 실패" \
            --arg description "admin.dinn production 배포가 실패했습니다. Actions 로그에서 실패한 step을 확인해야 합니다." \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$short_sha - $commit_message" \
            --arg commit_url "$commit_url" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$run_url" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  color: 15548997,
                  fields: [
                    {name: "브랜치", value: $branch, inline: true},
                    {name: "실행자", value: $actor, inline: true},
                    {name: "커밋", value: ("[" + $commit + "](" + $commit_url + ")"), inline: false},
                    {name: "실패 로그", value: ("[Actions 로그 열기](" + $run_url + ")"), inline: false}
                  ]
                }
              ]
            }' \
          )"
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
